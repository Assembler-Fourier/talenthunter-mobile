# Dedicated local development stack. Hosted settings are not changed by this file.
# Keep PostgreSQL's major version aligned with the hosted project.
project_id = "talenthunter-mobile"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Auth and Storage fixtures are created through their APIs by npm run local:seed.
enabled = false
sql_paths = []

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
# Captures messages on this Mac. No real email delivery is configured.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8082"
additional_redirect_urls = ["http://localhost:8082"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your TalentHunter Demo email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your TalentHunter Demo password"
content_path = "./supabase/templates/recovery.html"

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100

[edge_runtime]
enabled = false

[analytics]
enabled = false
